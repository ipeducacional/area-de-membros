<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Alunos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">Central de Alunos</div>
      <div style="display:flex; align-items:center; gap:16px;">
        <span class="user-name" id="user-name">Carregando...</span>
        <button class="btn-ghost" id="logout-btn">Sair</button>
      </div>
    </header>

    <main class="app-main">
      <div class="card cashback-card">
        <h3>Cashback</h3>
        <p class="card-sub">Seu saldo de créditos acumulados</p>
        <div class="cashback-value">—</div>
        <span class="cashback-badge">Em breve</span>
      </div>

      <div class="card">
        <h3>Minhas parcelas</h3>
        <p class="card-sub">Situação de pagamento das suas mensalidades e contratos</p>
        <div id="parcelas-container" class="loading-state">Carregando...</div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
