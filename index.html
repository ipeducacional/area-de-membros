<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Central de Alunos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-brand">
      <div class="login-brand-content">
        <div class="login-eyebrow">Central de Alunos</div>
        <div class="login-headline">Seu progresso,<br>suas contas,<br>seu jeito.</div>
      </div>
    </div>

    <div class="login-form-panel">
      <div class="login-form-wrap">
        <h2>Entrar</h2>
        <p class="subtitle">Acesse com o e-mail e senha cadastrados.</p>

        <div class="form-error" id="login-error"></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn-primary" id="login-submit">Entrar</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
</body>
</html>
